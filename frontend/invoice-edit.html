<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sửa hóa đơn - SAPI</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.css"><style>.line-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:.5rem;align-items:end}@media(max-width:768px){.line-grid{grid-template-columns:1fr}}</style></head>
<body><div class="page"><header class="navbar"><div class="container-xl"><a class="navbar-brand fw-bold fs-2 text-primary" href="./index.html">SAPI</a><div class="ms-auto"><button data-logout class="btn btn-outline-secondary btn-sm">Đăng xuất</button></div></div></header><div class="page-wrapper"><div class="page-header"><div class="container-xl"><div class="row"><div class="col"><h2 class="page-title">Sửa hóa đơn</h2></div><div class="col-auto"><a class="btn btn-outline-secondary" href="./index.html">Quay lại</a></div></div></div></div><div class="page-body"><div class="container-xl"><div id="notice" class="alert alert-info">Đang tải hóa đơn…</div><form id="form" class="card d-none"><div class="card-body"><div class="row g-3"><div class="col-md-6"><label class="form-label">Nhà cung cấp trong KiotViet</label><select id="supplier" class="form-select" required></select></div><div class="col-md-3"><label class="form-label">Số hóa đơn</label><input id="number" class="form-control"></div><div class="col-md-3"><label class="form-label">Ngày hóa đơn</label><input id="date" class="form-control" type="date"></div></div><hr><div id="items"></div><div class="row justify-content-end mt-3"><div class="col-md-3"><label class="form-label">Chiết khấu</label><input id="discount" class="form-control" type="number" min="0" step="0.01"></div></div></div><div class="card-footer d-flex justify-content-end gap-2"><button class="btn btn-primary">Lưu thay đổi</button></div></form></div></div></div></div><script src="./app.js"></script><script>
const id=new URLSearchParams(location.search).get('id');const notice=document.querySelector('#notice');let products=[];
async function api(url,options={}){const r=await fetch(url,options);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Không thể xử lý yêu cầu.');return j}
function line(item){const row=document.createElement('div');row.className='line-grid border-bottom py-3 invoice-line';const options=products.map(p=>`<option value="${p.product_id}" ${Number(p.product_id)===Number(item.product_id)?'selected':''}>${p.product_name} (${p.product_code||'chưa có mã'})</option>`).join('');row.innerHTML=`<div><label class="form-label">Hàng hóa</label><select class="form-select product">${options}</select></div><div><label class="form-label">Số lượng</label><input class="form-control quantity" type="number" min="0" step="0.01" value="${item.quantity}"></div><div><label class="form-label">Đơn vị</label><input class="form-control unit" value="${item.unit||''}"></div><div><label class="form-label">Đơn giá</label><input class="form-control price" type="number" min="0" step="0.01" value="${item.unit_price}"></div>`;document.querySelector('#items').append(row)}
(async()=>{try{const [invoice,suppliers,productRows]=await Promise.all([api(`/api/invoices/${encodeURIComponent(id)}`),api('/api/suppliers'),api('/api/products')]);products=productRows;document.querySelector('#supplier').innerHTML=suppliers.map(s=>`<option value="${s.supplier_id}" ${s.supplier_name===invoice.supplier_name?'selected':''}>${s.supplier_name}</option>`).join('');document.querySelector('#number').value=invoice.invoice_number||'';document.querySelector('#date').value=invoice.invoice_date?String(invoice.invoice_date).slice(0,10):'';document.querySelector('#discount').value=invoice.discount_amount||0;invoice.items.forEach(line);notice.className='alert alert-info';notice.textContent=invoice.status==='SYNCED'?'Lưu sẽ cập nhật cả phiếu nhập nháp trên KiotViet.':'Lưu trước, sau đó bấm Đồng bộ từ danh sách Nhập hàng.';document.querySelector('#form').classList.remove('d-none')}catch(e){notice.className='alert alert-danger';notice.textContent=e.message}})();
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;try{const items=[...document.querySelectorAll('.invoice-line')].map(row=>({productId:Number(row.querySelector('.product').value),quantity:row.querySelector('.quantity').value,unit:row.querySelector('.unit').value,unitPrice:row.querySelector('.price').value}));await api(`/api/invoices/${encodeURIComponent(id)}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({supplierId:Number(document.querySelector('#supplier').value),invoiceNumber:document.querySelector('#number').value,invoiceDate:document.querySelector('#date').value||null,discountAmount:document.querySelector('#discount').value,items})});notice.className='alert alert-success';notice.textContent='Đã lưu thay đổi.';setTimeout(()=>location.href=`/invoice-detail.html?id=${encodeURIComponent(id)}`,700)}catch(err){notice.className='alert alert-danger';notice.textContent=err.message;button.disabled=false}})
</script></body></html>
