<!doctype html>
<html lang="vi"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Chi tiết hóa đơn - SAPI</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.css" /></head>
<body><div class="page"><header class="navbar"><div class="container-xl"><a class="navbar-brand fw-bold fs-2 text-primary" href="/index.html">SAPI</a><div class="ms-auto"><span data-account-name class="text-secondary me-3"></span><button data-logout class="btn btn-outline-secondary btn-sm">Đăng xuất</button></div></div></header>
<main class="page-wrapper"><div class="page-header"><div class="container-xl d-flex justify-content-between"><h2 class="page-title">Chi tiết hóa đơn</h2><a href="/index.html" class="btn">Quay lại</a></div></div><div class="page-body"><div class="container-xl"><div id="notice" class="alert alert-info">Đang tải…</div><div id="content"></div></div></div></main></div>
<script src="/app.js"></script><script>
const invoiceId=new URLSearchParams(location.search).get('id');
const esc=(value)=>String(value??'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(url,options={}){const response=await fetch(url,options);const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Không thể xử lý yêu cầu.');return data}
async function load(){try{const row=await request(`/api/invoices/${encodeURIComponent(invoiceId)}`);document.querySelector('#notice').className=`alert alert-${row.status==='SYNCED'?'success':'warning'}`;document.querySelector('#notice').textContent=row.status==='SYNCED'?'Đã đồng bộ KiotViet.':'Hóa đơn chưa đồng bộ KiotViet.';document.querySelector('#content').innerHTML=`<div class="card"><div class="card-body"><p><strong>Nhà cung cấp:</strong> ${esc(row.supplier_name)}</p><p><strong>Số hóa đơn:</strong> ${esc(row.invoice_number)}</p><p><strong>Tổng tiền:</strong> ${new Intl.NumberFormat('vi-VN').format(row.total_amount)}</p>${row.status==='PENDING_SYNC'?'<button id="sync" class="btn btn-primary">Đồng bộ KiotViet</button>':''}</div><div class="table-responsive"><table class="table table-striped table-hover"><thead><tr><th>Hàng hóa</th><th>SL</th><th>Đơn vị</th><th>Đơn giá</th><th>Thành tiền</th></tr></thead><tbody>${row.items.map(i=>`<tr><td>${esc(i.product_name)}</td><td>${esc(i.quantity)}</td><td>${esc(i.unit)}</td><td>${esc(i.unit_price)}</td><td>${esc(i.total_price)}</td></tr>`).join('')}</tbody></table></div></div>`;document.querySelector('#sync')?.addEventListener('click',sync)}catch(error){document.querySelector('#notice').className='alert alert-danger';document.querySelector('#notice').textContent=error.message}}
async function sync(){const button=document.querySelector('#sync');button.disabled=true;button.textContent='Đang đồng bộ…';try{await request(`/api/invoices/${encodeURIComponent(invoiceId)}/sync`,{method:'POST'});await load()}catch(error){document.querySelector('#notice').className='alert alert-danger';document.querySelector('#notice').textContent=error.message;button.disabled=false;button.textContent='Đồng bộ KiotViet'}}
load();
</script></body></html>
