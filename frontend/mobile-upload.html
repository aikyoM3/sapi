<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Chụp hóa đơn - SAPI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.css" />
    <style>.preview-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}.preview-card img{width:100%;height:180px;object-fit:contain;background:#f1f3f5}</style>
  </head>
  <body class="bg-light"><main class="container py-4" style="max-width:640px">
    <h1 class="h2">Chụp hóa đơn</h1>
    <p class="text-secondary">Chụp lần lượt từng trang. Ảnh chỉ được gửi về máy tính để xử lý.</p>
    <input id="camera" class="d-none" type="file" accept="image/*" capture="environment" multiple />
    <button id="capture" class="btn btn-primary w-100 mb-3" type="button">Chụp ảnh / chọn ảnh</button>
    <div id="previews" class="preview-grid mb-3"></div>
    <button id="send" class="btn btn-success w-100" type="button" disabled>Gửi tất cả ảnh</button>
    <div id="status" class="mt-3 text-secondary" aria-live="polite"></div>
  </main>
  <script>
    const sessionToken = decodeURIComponent(location.pathname.split('/').filter(Boolean).at(-2) || '');
    const camera = document.querySelector('#camera');
    const previews = document.querySelector('#previews');
    const send = document.querySelector('#send');
    const status = document.querySelector('#status');
    let pages = [];

    function render() {
      previews.replaceChildren();
      pages.forEach((file, index) => {
        const card = document.createElement('div'); card.className = 'card preview-card';
        const image = document.createElement('img'); image.src = URL.createObjectURL(file); image.alt = `Trang ${index + 1}`;
        const body = document.createElement('div'); body.className = 'card-body p-2'; body.textContent = `Trang ${index + 1}`;
        const remove = document.createElement('button'); remove.className = 'btn btn-sm btn-outline-danger mt-2 w-100'; remove.type = 'button'; remove.textContent = 'Chụp lại / bỏ trang';
        remove.addEventListener('click', () => { URL.revokeObjectURL(image.src); pages.splice(index, 1); render(); });
        body.append(remove); card.append(image, body); previews.append(card);
      });
      send.disabled = !pages.length;
      status.textContent = pages.length ? `Đã chọn ${pages.length} trang.` : 'Chưa có ảnh.';
    }
    document.querySelector('#capture').addEventListener('click', () => camera.click());
    camera.addEventListener('change', () => { pages.push(...Array.from(camera.files)); camera.value = ''; render(); });
    send.addEventListener('click', async () => {
      send.disabled = true; status.className = 'mt-3 text-secondary'; status.textContent = 'Đang gửi ảnh…';
      try {
        const form = new FormData(); pages.forEach((file) => form.append('invoiceImages', file));
        const response = await fetch(`/api/public/invoice-sessions/${encodeURIComponent(sessionToken)}/images`, { method: 'POST', body: form });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.error || 'Không thể gửi ảnh.');
        status.className = 'mt-3 text-success'; status.textContent = `Đã gửi ${payload.added} trang. Bạn có thể quay lại máy tính để bấm “Gửi ảnh”.`;
        pages = []; previews.replaceChildren();
      } catch (error) { status.className = 'mt-3 text-danger'; status.textContent = error.message; send.disabled = false; }
    });
    render();
  </script>
  </body>
</html>
